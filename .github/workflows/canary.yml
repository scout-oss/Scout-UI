name: Canary Dry Run

on:
  workflow_dispatch:
    inputs:
      confirm:
        description:
          Type prepare-canary to generate non-publishing canary evidence.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: canary-dry-run-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dry-run:
    name: Canary dry run only
    if:
      github.repository == 'scout-oss/Scout-UI' && github.ref ==
      'refs/heads/main' && inputs.confirm == 'prepare-canary'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@11.21.0 --activate
      - name: Install frozen dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Generate isolated canary package evidence without publishing
        run:
          corepack pnpm release:canary-dry-run -- --identifier ${{ github.run_id
          }}.${{ github.run_attempt }}
      - name: Upload inspected canary artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: canary-dry-run-${{ github.sha }}
          path: .artifacts/release/canary/
          retention-days: 7
