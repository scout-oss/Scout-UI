name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and packages
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@11.21.0 --activate
      - name: Install frozen dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Format
        run: corepack pnpm format
      - name: Lint
        run: corepack pnpm lint
      - name: Typecheck
        run: corepack pnpm typecheck
      - name: Unit tests
        run: corepack pnpm test
      - name: Build
        run: corepack pnpm build
      - name: Asset and provenance checks
        run: corepack pnpm lint:assets
      - name: Release tooling and workflow policy
        run: corepack pnpm test:release
      - name: Package preflight and packed consumers
        run: corepack pnpm test:packages
      - name: Documentation and package budgets
        run: corepack pnpm test:docs-budgets

  required:
    name: CI / required
    if: always()
    needs: [quality]
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI dependency
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
        run: test "$QUALITY_RESULT" = success
