name: Release PR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-pr-main
  cancel-in-progress: false

jobs:
  version:
    name: Changesets release plan
    if:
      github.repository == 'scout-oss/Scout-UI' && github.ref ==
      'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@11.21.0 --activate
      - name: Install frozen dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Create or update the auditable version PR
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          commit: "chore: version Scout UI packages"
          github-token: ${{ secrets.RELEASE_PR_TOKEN }}
          title: "chore: version Scout UI packages"
          version: corepack pnpm release:version
