<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values="0 0 0 0 0.07  0 0 0 0 0.06  0 0 0 0 0.05  0 0 0 0.16 0" result="grainAlpha"/>
      <feComposite in="grainAlpha" in2="SourceGraphic" operator="in" result="grainIn"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="grainIn"/></feMerge>
    </filter>
    <filter id="sheen" x="0" y="0" width="100%" height="100%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="soft"/>
      <feSpecularLighting in="soft" surfaceScale="4" specularConstant="0.7" specularExponent="22" lighting-color="#ffffff" result="spec">
        <fePointLight x="40" y="-60" z="260"/>
      </feSpecularLighting>
      <feComposite in="spec" in2="SourceAlpha" operator="in" result="specIn"/>
      <feComposite in="SourceGraphic" in2="specIn" operator="arithmetic" k1="0" k2="1" k3="0.32" k4="0"/>
    </filter>
    <filter id="cut" x="-25%" y="-25%" width="150%" height="150%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="9" result="dilated"/>
      <feFlood flood-color="#fffdf7"/>
      <feComposite in2="dilated" operator="in" result="border"/>
      <feGaussianBlur in="dilated" stdDeviation="7" result="blur"/>
      <feOffset in="blur" dx="5" dy="9" result="offset"/>
      <feFlood flood-color="#120d18" flood-opacity="0.32"/>
      <feComposite in2="offset" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="border"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="dots" width="9" height="9" patternUnits="userSpaceOnUse">
      <circle cx="4.5" cy="4.5" r="2" fill="#121116" opacity="0.22"/>
    </pattern>
    <pattern id="dotsLight" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.6" fill="#ffffff" opacity="0.35"/>
    </pattern>
    <pattern id="twill" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="3" height="6" fill="#000" opacity="0.12"/>
    </pattern>
    <pattern id="airmail" width="56" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <rect width="14" height="20" fill="#d9363b"/>
      <rect x="14" width="14" height="20" fill="#f7f5ef"/>
      <rect x="28" width="14" height="20" fill="#1f4fbf"/>
      <rect x="42" width="14" height="20" fill="#f7f5ef"/>
    </pattern>
    <linearGradient id="foil" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a6416"/>
      <stop offset="0.22" stop-color="#ffe9a3"/>
      <stop offset="0.42" stop-color="#c8962a"/>
      <stop offset="0.6" stop-color="#fff4c9"/>
      <stop offset="0.8" stop-color="#b07d1c"/>
      <stop offset="1" stop-color="#ffe08a"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#61dbe8"/>
      <stop offset="0.7" stop-color="#ffd1e6"/>
      <stop offset="1" stop-color="#ff3d9a"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#aeb3bd"/>
      <stop offset="0.5" stop-color="#eef0f4"/>
      <stop offset="1" stop-color="#9aa0aa"/>
    </linearGradient>
  </defs>
  <g filter="url(#cut)"><g filter="url(#sheen)"><g filter="url(#grain)">
    <g transform="rotate(7 200 200)">
      <rect x="50" y="95" width="300" height="200" rx="16" fill="#121116"/>
      <rect x="66" y="110" width="268" height="118" rx="8" fill="#f7f5ef"/>
      <rect x="66" y="110" width="268" height="30" fill="#7c2cff"/>
      <rect x="66" y="140" width="268" height="12" fill="#d4ff5f"/>
      <rect x="66" y="152" width="268" height="8" fill="#ff3d9a"/>
      <text x="80" y="132" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="900" font-size="19" fill="#f7f5ef" letter-spacing="1">STICKER MIXTAPE</text>
      <text x="310" y="133" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="900" font-size="20" fill="#d4ff5f">A</text>
      <rect x="120" y="168" width="160" height="50" rx="24" fill="#121116"/>
      <circle cx="150" cy="193" r="24" fill="#121116" stroke="#f7f5ef" stroke-width="4"/><rect x="160.0" y="190.0" width="6" height="6" fill="#f7f5ef" transform="rotate(0 163.0 193.0)"/><rect x="153.5" y="201.3" width="6" height="6" fill="#f7f5ef" transform="rotate(60 156.5 204.3)"/><rect x="140.5" y="201.3" width="6" height="6" fill="#f7f5ef" transform="rotate(120 143.5 204.3)"/><rect x="134.0" y="190.0" width="6" height="6" fill="#f7f5ef" transform="rotate(180 137.0 193.0)"/><rect x="140.5" y="178.7" width="6" height="6" fill="#f7f5ef" transform="rotate(240 143.5 181.7)"/><rect x="153.5" y="178.7" width="6" height="6" fill="#f7f5ef" transform="rotate(300 156.5 181.7)"/><circle cx="150" cy="193" r="6" fill="#f7f5ef"/><circle cx="250" cy="193" r="24" fill="#121116" stroke="#f7f5ef" stroke-width="4"/><rect x="260.0" y="190.0" width="6" height="6" fill="#f7f5ef" transform="rotate(0 263.0 193.0)"/><rect x="253.5" y="201.3" width="6" height="6" fill="#f7f5ef" transform="rotate(60 256.5 204.3)"/><rect x="240.5" y="201.3" width="6" height="6" fill="#f7f5ef" transform="rotate(120 243.5 204.3)"/><rect x="234.0" y="190.0" width="6" height="6" fill="#f7f5ef" transform="rotate(180 237.0 193.0)"/><rect x="240.5" y="178.7" width="6" height="6" fill="#f7f5ef" transform="rotate(240 243.5 181.7)"/><rect x="253.5" y="178.7" width="6" height="6" fill="#f7f5ef" transform="rotate(300 256.5 181.7)"/><circle cx="250" cy="193" r="6" fill="#f7f5ef"/>
      <text x="80" y="185" font-family="'Marker Felt', 'Chalkboard SE', 'Comic Sans MS', cursive" font-size="16" fill="#121116" transform="rotate(-4 80 185)">vol.1</text>
      <path d="M110 295 L130 250 H270 L290 295 Z" fill="#2c2932"/>
      <circle cx="150" cy="276" r="7" fill="#f7f5ef"/><circle cx="250" cy="276" r="7" fill="#f7f5ef"/>
      <text x="200" y="244" font-family="'Courier New', Courier, monospace" font-size="11" fill="#f7f5ef" text-anchor="middle">SIDE A · 90 MIN · UI THAT STICKS</text>
    </g></g></g></g></svg>