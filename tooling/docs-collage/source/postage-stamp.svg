<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values="0 0 0 0 0.07  0 0 0 0 0.06  0 0 0 0 0.05  0 0 0 0.16 0" result="grainAlpha"/>
      <feComposite in="grainAlpha" in2="SourceGraphic" operator="in" result="grainIn"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="grainIn"/></feMerge>
    </filter>
    <filter id="sheen" x="0" y="0" width="100%" height="100%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="soft"/>
      <feSpecularLighting in="soft" surfaceScale="4" specularConstant="0.7" specularExponent="22" lighting-color="#ffffff" result="spec">
        <fePointLight x="40" y="-60" z="260"/>
      </feSpecularLighting>
      <feComposite in="spec" in2="SourceAlpha" operator="in" result="specIn"/>
      <feComposite in="SourceGraphic" in2="specIn" operator="arithmetic" k1="0" k2="1" k3="0.32" k4="0"/>
    </filter>
    <filter id="cut" x="-25%" y="-25%" width="150%" height="150%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="9" result="dilated"/>
      <feFlood flood-color="#fffdf7"/>
      <feComposite in2="dilated" operator="in" result="border"/>
      <feGaussianBlur in="dilated" stdDeviation="7" result="blur"/>
      <feOffset in="blur" dx="5" dy="9" result="offset"/>
      <feFlood flood-color="#120d18" flood-opacity="0.32"/>
      <feComposite in2="offset" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="border"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="dots" width="9" height="9" patternUnits="userSpaceOnUse">
      <circle cx="4.5" cy="4.5" r="2" fill="#121116" opacity="0.22"/>
    </pattern>
    <pattern id="dotsLight" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.6" fill="#ffffff" opacity="0.35"/>
    </pattern>
    <pattern id="twill" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="3" height="6" fill="#000" opacity="0.12"/>
    </pattern>
    <pattern id="airmail" width="56" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <rect width="14" height="20" fill="#d9363b"/>
      <rect x="14" width="14" height="20" fill="#f7f5ef"/>
      <rect x="28" width="14" height="20" fill="#1f4fbf"/>
      <rect x="42" width="14" height="20" fill="#f7f5ef"/>
    </pattern>
    <linearGradient id="foil" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a6416"/>
      <stop offset="0.22" stop-color="#ffe9a3"/>
      <stop offset="0.42" stop-color="#c8962a"/>
      <stop offset="0.6" stop-color="#fff4c9"/>
      <stop offset="0.8" stop-color="#b07d1c"/>
      <stop offset="1" stop-color="#ffe08a"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#61dbe8"/>
      <stop offset="0.7" stop-color="#ffd1e6"/>
      <stop offset="1" stop-color="#ff3d9a"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#aeb3bd"/>
      <stop offset="0.5" stop-color="#eef0f4"/>
      <stop offset="1" stop-color="#9aa0aa"/>
    </linearGradient>
  </defs>
  <g filter="url(#cut)"><g filter="url(#sheen)"><g filter="url(#grain)">
    <mask id="m-stamp"><rect width="400" height="400" fill="#fff"/><g fill="#000"><circle cx="102.0" cy="58" r="7"/><circle cx="102.0" cy="342" r="7"/><circle cx="122.0" cy="58" r="7"/><circle cx="122.0" cy="342" r="7"/><circle cx="142.0" cy="58" r="7"/><circle cx="142.0" cy="342" r="7"/><circle cx="162.0" cy="58" r="7"/><circle cx="162.0" cy="342" r="7"/><circle cx="182.0" cy="58" r="7"/><circle cx="182.0" cy="342" r="7"/><circle cx="202.0" cy="58" r="7"/><circle cx="202.0" cy="342" r="7"/><circle cx="222.0" cy="58" r="7"/><circle cx="222.0" cy="342" r="7"/><circle cx="242.0" cy="58" r="7"/><circle cx="242.0" cy="342" r="7"/><circle cx="262.0" cy="58" r="7"/><circle cx="262.0" cy="342" r="7"/><circle cx="282.0" cy="58" r="7"/><circle cx="282.0" cy="342" r="7"/><circle cx="302.0" cy="58" r="7"/><circle cx="302.0" cy="342" r="7"/><circle cx="92" cy="68.0" r="7"/><circle cx="308" cy="68.0" r="7"/><circle cx="92" cy="88.0" r="7"/><circle cx="308" cy="88.0" r="7"/><circle cx="92" cy="108.0" r="7"/><circle cx="308" cy="108.0" r="7"/><circle cx="92" cy="128.0" r="7"/><circle cx="308" cy="128.0" r="7"/><circle cx="92" cy="148.0" r="7"/><circle cx="308" cy="148.0" r="7"/><circle cx="92" cy="168.0" r="7"/><circle cx="308" cy="168.0" r="7"/><circle cx="92" cy="188.0" r="7"/><circle cx="308" cy="188.0" r="7"/><circle cx="92" cy="208.0" r="7"/><circle cx="308" cy="208.0" r="7"/><circle cx="92" cy="228.0" r="7"/><circle cx="308" cy="228.0" r="7"/><circle cx="92" cy="248.0" r="7"/><circle cx="308" cy="248.0" r="7"/><circle cx="92" cy="268.0" r="7"/><circle cx="308" cy="268.0" r="7"/><circle cx="92" cy="288.0" r="7"/><circle cx="308" cy="288.0" r="7"/><circle cx="92" cy="308.0" r="7"/><circle cx="308" cy="308.0" r="7"/><circle cx="92" cy="328.0" r="7"/><circle cx="308" cy="328.0" r="7"/></g></mask>
    <g transform="rotate(8 200 200)" mask="url(#m-stamp)">
      <rect x="92" y="58" width="216" height="284" fill="#fffaf0"/>
      <rect x="112" y="78" width="176" height="244" fill="#1664ff"/>
      <rect x="112" y="78" width="176" height="244" fill="url(#dotsLight)"/>
      <circle cx="200" cy="186" r="58" fill="#d4ff5f" stroke="#121116" stroke-width="4"/>
      <circle cx="182" cy="176" r="6" fill="#121116"/><circle cx="218" cy="176" r="6" fill="#121116"/>
      <path d="M176 200 q24 26 48 0" fill="none" stroke="#121116" stroke-width="6" stroke-linecap="round"/>
      <text x="124" y="110" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="900" font-size="26" fill="#fffaf0">25¢</text>
      <text x="200" y="282" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="900" font-size="20" fill="#fffaf0" text-anchor="middle" letter-spacing="1">OPEN SOURCE</text>
      <text x="200" y="306" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="700" font-size="13" fill="#d4ff5f" text-anchor="middle" letter-spacing="3">SCOUT POST</text>
    </g></g></g></g></svg>